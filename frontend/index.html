<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Wuppertal Live</title>
  <meta name="description" content="Карта текущих событий Вупперталя на основе официальных источников / Karte aktueller Ereignisse in Wuppertal">
  <meta name="theme-color" content="#0f1619">
  <!-- Тайлы OpenStreetMap требуют HTTP Referer (политика использования тайлов): не отключайте его -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map" aria-label="Karte"></div>

  <header id="topbar">
    <div class="bar">
      <div class="brand"><span class="mark" aria-hidden="true"></span><span class="name">Wuppertal Live</span></div>
      <button id="freshness" class="fresh" type="button" aria-haspopup="dialog">
        <span class="dot" id="freshDot"></span><span id="freshText"></span>
      </button>
      <button id="menuBtn" class="iconbtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu"></button>
    </div>

    <div id="banner" class="banner" hidden role="status"></div>

    <div class="chiprow">
      <button id="filterBtn" class="chip filterchip" type="button" aria-expanded="false" aria-controls="filterPanel">
        <span id="filterIcon"></span><span id="filterLabel"></span><span id="filterBadge" class="badge-n" hidden></span>
      </button>
      <div id="groupChips" class="chips" role="group"></div>
    </div>

    <div id="filterPanel" class="dropdown" hidden>
      <label class="field"><span id="lblDistrict"></span><select id="districtSel"></select></label>
      <label class="field"><span id="lblTime"></span><select id="timeSel"></select></label>
      <p id="periodHint" class="hint"></p>
      <button id="cityBtn" class="btn" type="button"></button>
    </div>

    <div id="menu" class="dropdown menu" hidden role="menu">
      <div class="seg" id="langSeg" role="group"></div>
      <button class="mi" id="miAbout" type="button" role="menuitem"></button>
      <a class="mi" id="lnkImpressum" href="impressum.html" role="menuitem">Impressum</a>
      <a class="mi" id="lnkPrivacy" href="datenschutz.html" role="menuitem">Datenschutz</a>
      <a class="mi" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer" role="menuitem">© OpenStreetMap</a>
    </div>
  </header>

  <section id="sheet" class="peek" aria-label="Events">
    <div id="sheetHandle" class="handle" role="button" tabindex="0" aria-label="Toggle list"><span></span></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <ul id="list" class="list"></ul>
  </section>

  <article id="detail" class="detail" hidden role="dialog" aria-modal="false" aria-labelledby="dTitle">
    <div class="grip" aria-hidden="true"></div>
    <button id="dClose" class="closebtn" type="button"></button>
    <div class="d-badges" id="dBadges"></div>
    <h2 id="dTitle"></h2>
    <div id="dTrans" class="d-trans" hidden></div>
    <p id="dDesc" class="d-desc"></p>
    <p id="dNote" class="d-note" hidden></p>
    <div id="dLoc" class="d-loc"></div>
    <ol id="dTimes" class="timeline"></ol>
    <div id="dSource" class="d-source"></div>
    <div class="d-actions"><button id="dShow" class="btn primary" type="button"></button></div>
  </article>

  <div id="about" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="modal-card">
      <button id="aboutClose" class="closebtn" type="button"></button>
      <h2 id="aboutTitle"></h2>
      <div id="aboutBody"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/tg.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
