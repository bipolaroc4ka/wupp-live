# Wuppertal Live — конфигурация Cloudflare Worker.
# НИЧЕГО не разворачивается автоматически: деплой вы запускаете сами (см. docs/CLOUDFLARE.md).

name = "wuppertal-live-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[observability]
enabled = true

# 1) Создайте базу:  npx wrangler d1 create wuppertal-live
# 2) Вставьте выданный database_id вместо значения ниже.
[[d1_databases]]
binding = "DB"
database_name = "wuppertal-live"
database_id = "97ba1363-f8de-44b7-81d7-239074c6a100"

# Необязательно: машинный перевод текстов событий на русский (Workers AI, модель m2m100, есть бесплатная квота).
# Без этих двух строк перевод просто выключен, приложение показывает немецкий оригинал.
[ai]
binding = "AI"

# Четыре cron-триггера (лимит бесплатного плана — 5 на аккаунт).
# Выражения ДОЛЖНЫ совпадать с CRON_MAP в src/cron.js.
[triggers]
crons = [
  "*/2 * * * *",   # Autobahn (дороги)
  "*/5 * * * *",   # NINA (официальные предупреждения)
  "*/10 * * * *",  # Presseportal (Feuerwehr/Polizei) + служебные задачи (переводы)
  "2-59/10 * * * *" # Stadt Wuppertal (пресс-релизы) + NRW.Mobidrom (дорожные работы)
]

[vars]
# Адрес вашего frontend (origin, без пути и без слэша на конце). Несколько — через запятую.
# Пример: "https://ваш-логин.github.io"
ALLOWED_ORIGINS = "*"

# Nominatim требует идентифицировать приложение. Укажите свою контактную почту или URL проекта.
NOMINATIM_CONTACT = "isychev10@gmail.com"

# Presseportal читается из публичных RSS-лент (Feuerwehr и Polizei Wuppertal): ключ и ID не нужны.

# Через сколько часов пресс-релиз перестаёт считаться «недавним» (RECENT -> EXPIRED).
PRESS_TTL_HOURS = "12"

# Автобаны, чьи данные запрашиваются (затем отфильтровываются по границам Wuppertal).
AUTOBAHN_ROADS = "A1,A46,A535,A43"

TRANSLATE_PROVIDER = "m2m"
# Перевод текстов событий (все три необязательны, см. README):
#   TRANSLATE_PROVIDER = "deepl" | "llm" | "m2m"     (по умолчанию: DeepL при наличии ключа, иначе языковая модель)
#   TRANSLATE_MODEL    = "@cf/google/gemma-3-12b-it"  (модель Workers AI для режима llm)

# Секреты (НЕ хранить здесь!) добавляются командами:
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put DEEPL_API_KEY            (необязательно: перевод через DeepL)
