
# Wuppertal Live — конфигурация Cloudflare Worker.
# Деплой выполняется вручную (см. docs/CLOUDFLARE.md).

name = "wuppertal-live-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Сохранять переменные, заданные через Cloudflare Dashboard,
# при деплое через Wrangler.
keep_vars = true

# Логи и наблюдаемость.
[observability]
enabled = true

# ============================================================
# D1 DATABASE
# ============================================================

[[d1_databases]]
binding = "DB"
database_name = "wuppertal-live"
database_id = "97ba1363-f8de-44b7-81d7-239074c6a100"

# ============================================================
# WORKERS AI
# ============================================================

# Binding для машинного перевода событий.
# Используется моделью M2M100.
[ai]
binding = "AI"

# ============================================================
# CRON TRIGGERS
# ============================================================

# Выражения должны совпадать с CRON_MAP в src/cron.js.
[triggers]
crons = [
  "*/2 * * * *",   # Autobahn — дорожные события
  "*/5 * * * *",   # NINA — официальные предупреждения
  "*/10 * * * *"   # Presseportal + служебные задачи, включая переводы
]

# ============================================================
# ENVIRONMENT VARIABLES
# ============================================================

[vars]

# Разрешённый frontend origin.
ALLOWED_ORIGINS = "https://bipolaroc4ka.github.io"

# Контакт для Nominatim.
NOMINATIM_CONTACT = "isychev10@gmail.com"

# Presseportal Newsroom IDs.
PRESSEPORTAL_OFFICE_IDS = "115885"

# Время жизни пресс-релизов в часах.
PRESS_TTL_HOURS = "12"

# Автобаны, данные которых запрашиваются.
AUTOBAHN_ROADS = "A1,A46,A535,A43"

# Машинный перевод.
# m2m — использовать M2M100 вместо Gemma.
TRANSLATE_PROVIDER = "m2m"

# ============================================================
# SECRETS
# ============================================================

# Секреты добавляются отдельно через Wrangler:
#
# npx wrangler secret put ADMIN_TOKEN
# npx wrangler secret put PRESSEPORTAL_API_KEY
# npx wrangler secret put DEEPL_API_KEY
#
# Не хранить секреты в этом файле или GitHub.
